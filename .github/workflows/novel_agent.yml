name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install & Build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==5.13.0
          pip install -r requirements.txt
          pyinstaller --onefile --name qm-app-win main.py
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/qm-app-win.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install & Build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==5.13.0
          pip install -r requirements.txt
          pyinstaller --onefile --name qm-app-macos main.py
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/qm-app-macos

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install & Build
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==5.13.0
          pip install -r requirements.txt
          pyinstaller --onefile --name qm-app-linux main.py
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/qm-app-linux

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-build'
          merge-multiple: false
      
      - name: Add Execute Permission
        run: chmod +x artifacts/macos-build/qm-app-macos artifacts/linux-build/qm-app-linux
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-build/qm-app-win.exe
            artifacts/macos-build/qm-app-macos
            artifacts/linux-build/qm-app-linux
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}