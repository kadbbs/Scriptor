[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptor"
version = "0.3.0"
description = "Evidence-grounded fiction workflow using the Responses API"
requires-python = ">=3.10"
dependencies = ["openai>=2.0,<3", "pydantic>=2.10,<3", "python-dotenv>=1.0,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
scriptor = "scriptor.cli:main"

[tool.setuptools.packages.find]
include = ["scriptor*"]

[tool.setuptools.package-data]
scriptor = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
